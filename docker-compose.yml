version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cybersutra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cybersutra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cybersutra-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/cybersutra
      SECRET_KEY: cybersutra-production-secret-key-rajasthan-2025
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybersutra-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
